<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="PillTime">
  <!-- Soft badge -->
  <rect width="128" height="128" rx="32" fill="#FFF9F2"/>
  <!-- Capsule (pill) -->
  <g transform="rotate(-32 64 64)">
    <rect x="22" y="48" width="84" height="32" rx="16" fill="#C2410C"/>
    <rect x="22" y="48" width="42" height="32" rx="16" fill="#FED7AA"/>
    <!-- Seam -->
    <line x1="64" y1="50" x2="64" y2="78" stroke="#FFF9F2" stroke-width="3" stroke-linecap="round"/>
  </g>
  <!-- Clock face = time -->
  <circle cx="64" cy="64" r="18" fill="#FFF9F2" stroke="#9A3412" stroke-width="3"/>
  <circle cx="64" cy="64" r="3" fill="#C2410C"/>
  <line x1="64" y1="64" x2="64" y2="52" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="74" y2="64" stroke="#C2410C" stroke-width="3" stroke-linecap="round"/>
</svg>
